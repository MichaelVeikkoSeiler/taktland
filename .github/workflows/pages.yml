# Baut Taktland bei jeder Änderung an main und veröffentlicht es auf GitHub Pages.
name: Veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Der Fahrplan (GTFS) erscheint zweimal pro Woche neu, und die Bedingungen von
  # opentransportdata.swiss verlangen, ihn regelmässig nachzuführen: montags und
  # donnerstags früh neu veröffentlichen (Zeit in UTC)
  schedule:
    - cron: '17 3 * * 1,4'
    # 3D-Land läuft seit 2026-11-06 hier (Michael: «alles auf Taktland laufen lassen»): täglich der Fahrplan für die Züge, wie bei 3dland.ch,
    # und alle 3 Stunden die Wolken (pipeline/build_wolken.py), MeteoSchweiz rechnet ICON-CH1 alle 3 Stunden neu
    - cron: '41 4 * * *'
    - cron: '50 1-22/3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# Läuft eine Veröffentlichung, wartet die nächste, statt sie abzubrechen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Pakete installieren
        working-directory: app
        run: npm ci

      # Baukasten, Validator und Baubefehl brauchen nur die Standardbibliothek,
      # die Tests zusätzlich pytest
      - name: Tests
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest -q generator/tests belegt/tests

      # Jedes Profil muss genau das sein, was bauen.py aus Fakten und Bauplan
      # macht. Wer ein Profil von Hand ändert, fällt hier auf.
      - name: Profile entsprechen dem Bauplan
        run: python3 generator/bauen.py --alle --pruefen

      - name: Profile gegen die Fakten prüfen
        run: python3 generator/validate.py --alle

      # Die Linienseiten: gleiche Regeln wie die Bahnhöfe, eigener Baukasten
      - name: Linienprofile entsprechen den Fakten
        run: python3 generator/linien.py --alle --pruefen

      - name: Linienprofile gegen die Fakten prüfen
        run: python3 generator/linien.py --validieren

      # Die Vergleichsfragen entstehen erst in der App, geprueft wird darum
      # ihre Grundlage: jeder Wert gegen die Faktendatei, aus der er stammt
      - name: Vergleichsdaten gegen die Fakten prüfen
        run: python3 generator/validate_vergleich.py

      # Die Seite «Strecke» zählt in der App, was je Abschnitt vorbereitet ist:
      # geprüft wird, dass jede Liste genau die Tunnel und Brücken der Linie
      # zwischen den Kilometern des Abschnitts enthält
      - name: Streckennetz gegen die Linienfakten prüfen
        run: python3 generator/strecken.py --validieren

      # Fahrplan für «Welcher Zug?»: neueste Datei laden (290 MB) und auf Züge und
      # Bahnhöfe im Netz verdichten. Klappt es nicht, erscheint die App ohne
      # Fahrplan; der Fahrtmodus sagt dann, dass er fehlt.
      # Fahrplan, Züge und Schiffe einmal am Tag; die Läufe alle 3 Stunden für die Wolken nehmen sie aus dem Zwischenspeicher vom selben Tag
      # montags und donnerstags ab 13 Uhr UTC neu: die Echtzeit (GTFS-RT) wechselt dann um 15 Uhr auf die neue Fassung des Fahrplans, deren
      # Fahrtnummern (trip_id) andere sind; mit dem Fahrplan vom Morgen passte sie bis zum nächsten Tag nicht (echtzeit.ts)
      - id: tag
        run: |
          t=$(date -u +%F)
          if [ "$(date -u +%u)" = 1 ] || [ "$(date -u +%u)" = 4 ]; then [ "$(date -u +%H)" -ge 13 ] && t="$t-b"; fi
          echo "tag=$t" >> "$GITHUB_OUTPUT"
      - id: fahrplan
        uses: actions/cache@v4
        with:
          path: |
            data/fahrplan
            data/zuege3d
            data/schiffe3d
          key: fahrplan-${{ steps.tag.outputs.tag }}-${{ hashFiles('pipeline/fetch_fahrplan.py', 'pipeline/build_fahrplan.py', 'pipeline/build_zuege3d.py', 'pipeline/build_schiffe3d.py', 'data/strecken.json', 'data/schifflinien.json') }}
      - name: Fahrplan laden und verdichten
        if: steps.fahrplan.outputs.cache-hit != 'true'
        run: |
          python3 pipeline/fetch_fahrplan.py && python3 pipeline/build_fahrplan.py \
            || echo "::warning::Fahrplan nicht gebaut, die App erscheint ohne"

      # Züge und Schiffe für 3D-Land aus demselben Fahrplan (pipeline/build_zuege3d.py, build_schiffe3d.py; Michael,
      # 2026-10-28: «Bitte diese Sachen auch für Taktland»); klappt es nicht, erscheint 3D-Land ohne
      - name: Züge und Schiffe für 3D-Land
        if: steps.fahrplan.outputs.cache-hit != 'true'
        run: |
          python3 pipeline/build_zuege3d.py || echo "::warning::Züge und Schiffe nicht gebaut, 3D-Land erscheint ohne"
          rm -rf data/raw/gtfs

      # Stellt sicher, dass die App die aktuellen Profile ausliefert, auch wenn
      # jemand vergessen hat, export_app.py vor dem Einchecken laufen zu lassen
      - name: Daten für die App bereitstellen
        run: python3 pipeline/export_app.py

      - name: Bauen
        working-directory: app
        run: npm run build

      # 3dland.ch baut sein eigenes Repository aus diesem Code; hier nur eine Probe, damit ein Fehler früh auffällt
      - name: 3dland bauen (Probe)
        working-directory: app
        run: npx vite build -c vite.3dland.config.ts && node scripts/3dland_fertig.mjs

      # taktland.ch: an der Wurzel die Seite aus web/, die App unter /app/
      # (Michael, 2026-09-30)
      - name: Seite zusammenstellen
        run: |
          python3 pipeline/export_web.py
          for d in zuege3d schiffe3d; do if [ -d data/$d ]; then cp -r data/$d _site/app/$d; fi; done

      # Wolken, Regen und Schnee aus ICON-CH1-EPS von MeteoSchweiz für 3D-Land und den Führerstand (pipeline/build_wolken.py, braucht eccodes),
      # neben die App; bis 2026-11-06 las Taktland sie bei 3dland.ch; klappt es nicht, erscheint die App ohne Wolken
      - name: Wolken
        continue-on-error: true
        run: |
          python3 -m venv /tmp/wolken && /tmp/wolken/bin/pip install --quiet eccodes numpy
          /tmp/wolken/bin/python pipeline/build_wolken.py && cp -r data/wolken _site/app/wolken

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
