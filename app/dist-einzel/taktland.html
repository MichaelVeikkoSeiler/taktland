}, {"id": "zuege", "title": "Züge auf der Strecke", "body": "Schönbühl SBB liegt an der Linie 450 zwischen Olten Süd und Bern. Auf dem Abschnitt Richtung Mattstetten verkehren 20'615 Personenzüge pro Jahr, rund 56 pro Tag in beiden Richtungen zusammen. Gezählt werden Züge auf dem Streckenabschnitt, nicht Halte am Bahnhof.", "facts": [{"label": "Personenzüge pro Jahr Richtung Mattstetten", "value": 20615, "unit": "Züge", "source": "zugzahlen", "factRef": "zuege.staerkster_personenverkehr.zuege_pro_jahr"}, {"label": "Personenzüge pro Tag Richtung Mattstetten", "value": 56, "unit": "Züge", "source": "zugzahlen", "factRef": "zuege.staerkster_personenverkehr.zuege_pro_tag"}, {"label": "Linie", "value": 450, "unit": null, "source": "linie-mit-betriebspunkten", "factRef": "linien.items[0].nummer"}], "questions": [{"type": "single_choice", "prompt": "Wie viele Personenzüge verkehren pro Tag auf dem Abschnitt Richtung Mattstetten?", "options": ["12", "56", "180", "640"], "correct": 1, "explanation": "Rund 56 Personenzüge pro Tag, beide Richtungen zusammen.", "factRef": "zuege.staerkster_personenverkehr.zuege_pro_tag", "difficulty": 2}], "erlaeuterung": "Zugzahlen werden pro Streckenabschnitt erhoben, nicht pro Bahnhof. Ein Zug, der durchfährt, zählt gleich wie einer, der hält."}, {"id": "services", "title": "Was es am Bahnhof gibt", "body": "Erfasst sind 1 Billettautomat vom Typ Libero und 2 Billettentwerter. Eine Wartehalle ist vorhanden. WLAN ist für diesen Bahnhof nicht erfasst.", "facts": [{"label": "Billettautomaten", "value": 1, "unit": null, "source": "billetautomat", "factRef": "services.billettautomaten_erfasst"}, {"label": "Billettentwerter", "value": 2, "unit": null, "source": "billetentwerter", "factRef": "services.billettentwerter_erfasst"}], "questions": [{"type": "true_false", "prompt": "Am Bahnhof Schönbühl SBB ist ein Billettentwerter erfasst, aber kein Automat.", "correct": false, "explanation": "Erfasst sind 1 Automat und 2 Entwerter.", "factRef": "services.billettautomaten_erfasst", "difficulty": 2}]}], "luecken": [{"thema": "Bahnhofplan", "grund": "Für diesen Bahnhof ist kein Bahnhofplan veröffentlicht. Pläne liegen für 60 der 769 SBB-Bahnhöfe vor.", "quelle": "haltestelle-karte-trafimage"}, {"thema": "Tagesrhythmus", "grund": "Wie sich die Besucherzahl über den Tag verteilt, ist nur für 26 grosse Bahnhöfe erhoben.", "quelle": "anzahl-sbb-bahnhofbenutzer-tagesverlauf"}, {"thema": "Bahnhofbenutzer", "grund": "Die Zahl aller Bahnhofbenutzer, auch ohne Zugfahrt, ist nur für 28 Bahnhöfe erhoben. Erfasst sind hier nur Ein- und Aussteigende.", "quelle": "anzahl-sbb-bahnhofbenutzer"}, {"thema": "Vollständigkeit der Gleise", "grund": "Erfasst sind 2 Gleise (3, 4). Ob der Bahnhof weitere Gleise hat, etwa unterirdische oder solche anderer Bahnen, sagen die offenen Daten nicht.", "quelle": "21197_behig-haltekantesegment"}, {"thema": "Sektoren", "grund": "Zu den Gleisen 3, 4 sind keine Sektortafeln erfasst.", "quelle": "sektortafel"}, {"thema": "WLAN", "grund": "Dieser Bahnhof steht nicht in der Liste der WLAN-Standorte. Die Liste umfasst 79 Standorte und ist keine vollständige Auskunft.", "quelle": "wifistation"}, {"thema": "Stand der BehiG-Daten", "grund": "Die Angaben zu Perronhöhen und Hindernisfreiheit haben den Stand 2023, die übrigen Daten sind neuer.", "quelle": "21197_behig-haltekantesegment"}, {"thema": "Abgrenzung der Frequenzzahl", "grund": "Die Quelle vermerkt zur Zahl der Ein- und Aussteigenden: «Ohne RBS.» Die Zahl deckt also nicht zwingend dasselbe ab wie die Gleis- und Perrondaten.", "quelle": "passagierfrequenz"}, {"thema": "Fahrplan", "grund": "Welche Züge hier halten und wohin sie fahren, ist nicht Teil dieser Daten. Die Zugzahlen zählen Fahrten auf den Streckenabschnitten.", "quelle": "zugzahlen"}]}}}</script>
