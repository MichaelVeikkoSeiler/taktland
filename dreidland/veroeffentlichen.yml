# Gehört ins Repository 3dland als .github/workflows/veroeffentlichen.yml (Michael, 2026-10-21).
# Baut 3dland.ch aus dem Code von Taktland (öffentlich, darum ohne Schlüssel) und veröffentlicht es auf GitHub Pages
# dieses Repositorys. Die Daten liegen nicht hier, die Seite holt sie von taktland.ch und daten.taktland.ch.
name: Veröffentlichen

on:
  workflow_dispatch:
  push:
    branches: [main]
  # Änderungen an Taktland erreichen 3dland so spätestens am nächsten Morgen (Zeit in UTC)
  schedule:
    - cron: '41 4 * * *'
    # die Wolken (pipeline/build_wolken.py): MeteoSchweiz rechnet ICON-CH1 alle 3 Stunden neu (Michael, 2026-10-28)
    - cron: '50 1-22/3 * * *'
    # montags und donnerstags kurz nach 15 Uhr Schweizer Zeit (im Sommer 16 Uhr) der neue Fahrplan zur neuen Echtzeit
    - cron: '7 14 * * 1,4'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: MichaelVeikkoSeiler/taktland
          # die Züge brauchen dazu die Pipeline und das Netz (Michael, 2026-10-26: «die Züge … NUR für 3DLand»)
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            app/
            pipeline/fetch_fahrplan.py
            pipeline/build_zuege3d.py
            pipeline/build_schiffe3d.py
            pipeline/build_wolken.py
            data/strecken.json
            data/schifflinien.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Pakete installieren
        working-directory: app
        run: npm ci

      - name: Bauen
        working-directory: app
        run: npx tsc -b && npx vite build -c vite.3dland.config.ts && node scripts/3dland_fertig.mjs

      # Züge und Schiffe laut Fahrplan (pipeline/build_zuege3d.py, build_schiffe3d.py): das GTFS von opentransportdata.swiss,
      # täglich neu, wie es die Nutzungsbedingungen verlangen; klappt es nicht, erscheint 3dland ohne Züge und Schiffe
      # alle 3 Stunden neu nur für die Wolken: Züge und Schiffe vom selben Tag und derselben Pipeline aus dem Zwischenspeicher
      # montags und donnerstags ab 13 Uhr UTC neu: die Echtzeit (GTFS-RT) wechselt dann um 15 Uhr auf die neue Fassung des Fahrplans, deren
      # Fahrtnummern (trip_id) andere sind; mit dem Fahrplan vom Morgen passte sie bis zum nächsten Tag nicht (echtzeit.ts)
      - id: tag
        run: |
          t=$(date -u +%F)
          # die Echtzeit wechselt um 15 Uhr Schweizer Zeit (im Winter 14 Uhr UTC, im Sommer 13 Uhr UTC); vorher gebaut passte der neue
          # Fahrplan bis 15 Uhr nicht zur Echtzeit (Michael, 2026-11-12, Luzern 14:46: «Alle Züge … keine Echtzeit gemeldet»)
          if [ "$(TZ=Europe/Zurich date +%u)" = 1 ] || [ "$(TZ=Europe/Zurich date +%u)" = 4 ]; then [ "$(TZ=Europe/Zurich date +%H)" -ge 15 ] && t="$t-b"; fi
          echo "tag=$t" >> "$GITHUB_OUTPUT"
      - id: zuege
        uses: actions/cache@v4
        with:
          path: |
            data/zuege3d
            data/schiffe3d
          key: zuege3d-${{ steps.tag.outputs.tag }}-${{ hashFiles('pipeline/build_zuege3d.py', 'pipeline/build_schiffe3d.py', 'data/strecken.json', 'data/schifflinien.json') }}
      - name: Züge und Schiffe laut Fahrplan
        if: steps.zuege.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          python3 pipeline/fetch_fahrplan.py && python3 pipeline/build_zuege3d.py
          rm -rf data/raw/gtfs
      - name: Züge und Schiffe neben die Seite
        run: |
          if [ -d data/zuege3d ]; then cp -r data/zuege3d app/dist-3dland/zuege3d; fi
          if [ -d data/schiffe3d ]; then cp -r data/schiffe3d app/dist-3dland/schiffe3d; fi

      # Wolken aus ICON-CH1-EPS von MeteoSchweiz (pipeline/build_wolken.py, braucht eccodes); Taktland liest sie hier; klappt es nicht,
      # erscheint 3dland ohne Wolken
      - name: Wolken
        continue-on-error: true
        run: |
          python3 -m venv /tmp/wolken && /tmp/wolken/bin/pip install --quiet eccodes numpy
          /tmp/wolken/bin/python pipeline/build_wolken.py && cp -r data/wolken app/dist-3dland/wolken

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist-3dland

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
