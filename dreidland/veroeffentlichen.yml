# Gehört ins Repository 3dland als .github/workflows/veroeffentlichen.yml (Michael, 2026-10-21).
# Baut 3dland.ch aus dem Code von Taktland (öffentlich, darum ohne Schlüssel) und veröffentlicht es auf GitHub Pages
# dieses Repositorys. Die Daten liegen nicht hier, die Seite holt sie von taktland.ch und daten.taktland.ch.
name: Veröffentlichen

on:
  workflow_dispatch:
  push:
    branches: [main]
  # Änderungen an Taktland erreichen 3dland so spätestens am nächsten Morgen (Zeit in UTC)
  schedule:
    - cron: '41 4 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: MichaelVeikkoSeiler/taktland
          # die Züge brauchen dazu die Pipeline und das Netz (Michael, 2026-10-26: «die Züge … NUR für 3DLand»)
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            app/
            pipeline/fetch_fahrplan.py
            pipeline/build_zuege3d.py
            data/strecken.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Pakete installieren
        working-directory: app
        run: npm ci

      - name: Bauen
        working-directory: app
        run: npx tsc -b && npx vite build -c vite.3dland.config.ts && node scripts/3dland_fertig.mjs

      # Züge laut Fahrplan (pipeline/build_zuege3d.py): das GTFS von opentransportdata.swiss, täglich neu, wie es die
      # Nutzungsbedingungen verlangen; klappt es nicht, erscheint 3dland ohne Züge
      - name: Züge laut Fahrplan
        continue-on-error: true
        run: |
          python3 pipeline/fetch_fahrplan.py && python3 pipeline/build_zuege3d.py && cp -r data/zuege3d app/dist-3dland/zuege3d
          rm -rf data/raw/gtfs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist-3dland

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
